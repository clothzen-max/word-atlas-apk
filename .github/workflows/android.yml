name: Build Word Atlas APK

on:
  workflow_dispatch:
    inputs:
      remote_url:
        description: "在线壳模式：填你部署好的网址（留空 = 离线全量包）"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK 35
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 安装壳工程依赖
        run: npm install --no-audit --no-fund

      - name: 拉取词光源码并构建（离线全量）
        if: ${{ inputs.remote_url == '' }}
        run: node scripts/build-web.mjs

      - name: 资源瘦身（音频 24kbps / 插画 320px）
        if: ${{ inputs.remote_url == '' }}
        run: node scripts/slim.mjs

      - name: 生成占位页（在线壳，只保留骨架）
        if: ${{ inputs.remote_url != '' }}
        run: |
          mkdir -p upstream/dist
          cat > upstream/dist/index.html <<'HTML'
          <!doctype html><html lang="zh"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>词光</title>
          <style>html,body{margin:0;height:100%;background:#0B1220;color:#E6EEF8;
          font:15px/1.6 system-ui,sans-serif;display:flex;align-items:center;
          justify-content:center;text-align:center}</style></head>
          <body><div><div style="font-size:22px;letter-spacing:.3em;margin-bottom:10px">词光</div>
          <div style="opacity:.6">正在连接…</div></div></body></html>
          HTML
          ls -l upstream/dist

      - name: 生成 Android 工程
        env:
          ATLAS_REMOTE_URL: ${{ inputs.remote_url }}
        run: |
          npx cap add android
          npx cap sync android
          grep -E "applicationId" android/app/build.gradle

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 汇总
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          ls -lh "$APK"
          SIZE=$(du -h "$APK" | cut -f1)
          echo "### 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- APK：\`$(basename "$APK")\`（$SIZE）" >> $GITHUB_STEP_SUMMARY
          echo "- 模式：$([ -n '${{ inputs.remote_url }}' ] && echo "在线壳 ${{ inputs.remote_url }}" || echo '离线全量')" >> $GITHUB_STEP_SUMMARY

      - name: 发布到 Release（便于镜像加速下载）
        if: ${{ inputs.remote_url == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/word-atlas.apk
          gh release delete slim-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create slim-apk /tmp/word-atlas.apk \
            --title "词光 APK（瘦身离线版）" \
            --notes "内置 7,298 词条、插画、英音美音与例句朗读；音频 24 kbps，插画 320 px。"

      - uses: actions/upload-artifact@v4
        with:
          name: word-atlas-apk
          path: android/app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 14
