name: Build Word Atlas APK

on:
  workflow_dispatch:
    inputs:
      remote_url:
        description: "在线壳模式：填你部署好的网址（留空 = 离线全量包）"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore: ["README.md"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK 35
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 安装壳工程依赖
        run: npm install --no-audit --no-fund

      - name: 拉取词光源码并构建
        run: node scripts/build-web.mjs

      - name: 生成 Android 工程
        env:
          ATLAS_REMOTE_URL: ${{ inputs.remote_url }}
        run: |
          npx cap add android
          npx cap sync android
          grep -E "applicationId" android/app/build.gradle

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 汇总
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          ls -lh "$APK"
          SIZE=$(du -h "$APK" | cut -f1)
          echo "### 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- APK：\`$(basename "$APK")\`（$SIZE）" >> $GITHUB_STEP_SUMMARY
          echo "- 模式：$([ -n '${{ inputs.remote_url }}' ] && echo "在线壳 ${{ inputs.remote_url }}" || echo '离线全量')" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: word-atlas-apk
          path: android/app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 14
